name: miyamoto

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      SERVER_URL: http://server:3000
      NEXT_PUBLIC_SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      CORS_ORIGIN: http://localhost:3001
      # Overrides apps/server/.env so the container talks to the compose
      # database rather than a host one.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/miyamoto
      # Used to build the confirmation link in the deletion email.
      WEB_URL: http://localhost:3001
      # SMTP is read from apps/server/.env via env_file above. Absent
      # credentials are logged by [mail] and the request still succeeds —
      # see packages/api/src/lib/mail.ts.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    init: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: miyamoto
    volumes:
      - miyamoto-db:/var/lib/postgresql/data
    healthcheck:
      # The server's healthcheck gates on this one, so it has to mean
      # "accepting queries", not "process started".
      test: ["CMD-SHELL", "pg_isready -U postgres -d miyamoto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  miyamoto-db:
